{% extends "index.html" %}

{% block content %}
    <div class="post">
        {% if not page.extra or not page.extra.hide_title %}
            {{ post_macros::header(page=page) }}
        {% endif %}
        {{ post_macros::content(page=page, summary=false) }}
        {{ post_macros::earlier_later(page=page) }}
    </div>
{% endblock content %}
